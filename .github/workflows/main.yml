name: Procesador Diario de Videos Cortos IA

on:
  schedule:
    # Minutos poco habituales: GitHub retrasa mucho las tareas programadas en punto
    - cron: '37 8,13,19 * * *'  # ~9:37, 14:37 y 20:37 en España (horario de invierno)
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo generar el vídeo y mandarlo a Telegram (sin publicar ni gastar historia)'
        type: boolean
        default: false
      encolar_tiktok:
        description: 'Dejar el vídeo en la cola de publicar_tiktok.py'
        type: boolean
        default: false

# Nunca dos episodios a la vez: los dos leerían el mismo contador
concurrency:
  group: episodio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: 1. Descargar los archivos del repositorio
      uses: actions/checkout@v5
      with:
        # La última versión de main, no la del momento en que se lanzó: si otra ejecución
        # acaba de guardar progreso mientras esta esperaba turno, se repetiría el episodio
        ref: main

    - name: 2. Configurar el entorno de Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: 3. Instalar librerías del sistema para procesar video
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-liberation
        # Permitir a ImageMagick leer los archivos de texto que usa MoviePy
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml

    - name: 4. Instalar librerías de Python
      run: |
        pip install --upgrade pip
        pip install "moviepy==1.0.3" "pillow==9.5.0" edge-tts requests python-telegram-bot google-api-python-client google-auth scipy

    - name: 5. Ejecutar el robot programador
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        TIKTOK_MODO: ${{ vars.TIKTOK_MODO }}
        PRUEBA: ${{ inputs.prueba }}
        ENCOLAR_TIKTOK: ${{ inputs.encolar_tiktok }}
        GH_TOKEN: ${{ github.token }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        VOZ: ${{ vars.VOZ }}
        PARTES_POR_CASO: ${{ vars.PARTES_POR_CASO }}
      run: python -u bot.py

    - name: 6. Guardar cambios en el repositorio
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add contador.txt historias.txt casos_publicados.txt semana.json
        git diff --staged --quiet || (git commit -m "🤖 Bot: Episodio procesado con éxito" && git pull --rebase && git push)
