name: Procesador Diario de Videos Cortos IA

on:
  schedule:
    # Se ejecuta todos los días a las 18:00 UTC (20:00 hora de España)
    - cron: '0 18 * * *'
  workflow_dispatch: # Esto activa el botón "Run workflow" para hacer pruebas manuales

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Descargar los archivos del repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar el entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Instalar librerías del sistema para procesar video
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick

    - name: 4. Instalar librerías de Python (100% Gratis)
      run: |
        pip install --upgrade pip
        pip install moviepy edge-tts requests python-telegram-bot

    - name: 5. Ejecutar el robot programador
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot.py

    - name: 6. Guardar cambios en el repositorio (Avanzar episodio y borrar historia usada)
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add contador.txt historias.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Bot: Episodio procesado con éxito" && git push)
