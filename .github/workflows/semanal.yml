name: Recopilación semanal

# Domingo por la mañana (hora de España en invierno: ~11:23). Minuto raro: GitHub retrasa las horas en punto.
on:
  schedule:
    - cron: '23 10 * * 0'
  workflow_dispatch:
    inputs:
      prueba:
        description: 'Solo montar el vídeo (sin publicar ni vaciar la semana)'
        type: boolean
        default: false

# Que no coincida con un episodio: los dos tocan semana.json
concurrency:
  group: episodio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recopilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v5
      with:
        ref: main
    - uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Instalar ffmpeg y fuentes
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-liberation
    - run: pip install edge-tts requests pillow google-api-python-client google-auth
    - name: Montar y publicar la recopilación
      env:
        YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        VOZ: ${{ vars.VOZ }}
        PRUEBA: ${{ inputs.prueba }}
        GH_TOKEN: ${{ github.token }}
      run: python -u recopilacion.py
    - name: Guardar la semana vacía
      if: ${{ inputs.prueba != true }}
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add semana.json
        git diff --staged --quiet || (git commit -m "🤖 Bot: recopilación semanal publicada" && git pull --rebase && git push)
